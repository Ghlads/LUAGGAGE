# Préfixe : Ctrl+a (plus proche des doigts que Ctrl+b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Confort
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g set-clipboard on
setw -g mode-keys vi

# Couleurs (Kitty)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"

# Découpage intuitif, dans le dossier courant
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Navigation entre panneaux façon Vim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Recharger la config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config rechargée"

# Barre d'état sobre
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left "#[bold] #S  "
set -g status-right "%H:%M "
set -g window-status-current-style "bold,fg=#7aa2f7"
